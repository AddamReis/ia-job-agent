name: deploy-discovery

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "deploy/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/deploy-discovery.yml"
  workflow_dispatch:

# O Spark está na LAN (10.10.10.2), inalcançável por runners hospedados.
# O runner self-hosted roda no próprio DGX Spark, sob o usuário addam.
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar código e subir robô de dados
        env:
          DEPLOY_PATH: /home/addam/ia-job-agent
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH/data"
          rsync -az --delete \
            --exclude='.git' --exclude='data' --exclude='.venv' \
            --exclude='.env' --exclude='__pycache__' --exclude='.pytest_cache' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_PATH/"
          cd "$DEPLOY_PATH"
          docker compose --env-file .env -f deploy/postgres.yaml -f deploy/discovery.yaml up -d --build --wait
          docker compose --env-file .env -f deploy/postgres.yaml -f deploy/discovery.yaml ps
          docker compose --env-file .env -f deploy/postgres.yaml -f deploy/discovery.yaml exec -T discovery \
            python -c "from src.core.config import Settings; from src.storage.database import Repository; s=Settings.load(); r=Repository(); print('database=', r.engine.url.render_as_string(hide_password=True)); print('browser=', repr(s.browser.source), 'slots=', s.discovery_schedule.slots)"
