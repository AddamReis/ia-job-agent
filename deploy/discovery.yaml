# Serviço de população e classificação da base — roda no DGX Spark.
# Quatro slots/dia configurados em config/config.yaml (10:00/12:30/15:00/18:30).
# A candidatura roda LOCALMENTE (application-serve) com o Chrome CDP logado;
# o handoff é o outbox agent_events no mesmo Postgres.
services:
  discovery:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ia-job-agent:latest
    container_name: ia-job-agent-discovery
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-m", "src.cli", "discovery-serve"]
    environment:
      TZ: America/Sao_Paulo
      # Chromium embutido no container; o Chrome logado fica só no apply local.
      AI_JOB_BROWSER_SOURCE: ""
      # Postgres no Spark (vazio mantém o SQLite legado, usado nos testes).
      AI_JOB_DATABASE_URL: ${AI_JOB_DATABASE_URL:-}
    volumes:
      - ../data:/app/data
      - ../config:/app/config:ro
