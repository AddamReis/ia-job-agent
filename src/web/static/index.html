<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101828">
  <meta name="description" content="Revisão das vagas classificadas pelo agente">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <title>Revisão de vagas</title>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Revisão de vagas</h1>
      <p id="subtitle">Carregando…</p>
    </div>
    <button id="refresh" class="icon-btn" title="Atualizar" aria-label="Atualizar">↻</button>
  </header>

  <div class="filter">
    <label for="bucket">Lista</label>
    <select id="bucket" aria-label="Filtrar vagas">
      <option value="approval" selected>Aguardando Aprovação</option>
      <option value="pending">A Classificar</option>
      <option value="submitted">Enviados</option>
      <option value="rejected">Recusado</option>
      <option value="errors">Erros</option>
      <option value="all">Todas</option>
    </select>
    <input id="search" type="search" aria-label="Buscar no texto das vagas"
           placeholder="Buscar: título, empresa, descrição, análise…" autocomplete="off">
    <select id="sort" aria-label="Ordenar pela hora de inclusão">
      <option value="newer" selected>Mais recentes</option>
      <option value="older">Mais antigos</option>
    </select>
  </div>

  <main id="list" class="list" aria-live="polite"></main>

  <nav class="pager" aria-label="Paginação">
    <button id="prev" class="page-btn" type="button">← Anterior</button>
    <span id="page-info">—</span>
    <button id="next" class="page-btn" type="button">Próxima →</button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <button class="sheet-close" data-close aria-label="Fechar">×</button>
      <div id="detail"></div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
