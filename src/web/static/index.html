<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101828">
  <meta name="description" content="Revisão das vagas classificadas pelo agente">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <title>Revisão de vagas</title>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Revisão de vagas</h1>
      <p id="subtitle">Carregando…</p>
    </div>
    <button id="refresh" class="icon-btn" title="Atualizar" aria-label="Atualizar">↻</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-bucket="pending" role="tab">A classificar <span class="badge" id="count-pending">0</span></button>
    <button class="tab" data-bucket="rejected" role="tab">Recusadas <span class="badge" id="count-rejected">0</span></button>
    <button class="tab" data-bucket="approved" role="tab">Aprovadas <span class="badge" id="count-approved">0</span></button>
    <button class="tab" data-bucket="all" role="tab">Todas <span class="badge" id="count-all">0</span></button>
  </nav>

  <main id="list" class="list" aria-live="polite"></main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <button class="sheet-close" data-close aria-label="Fechar">×</button>
      <div id="detail"></div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
